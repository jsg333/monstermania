<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Monstermania</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #10241a; overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-user-select: none; user-select: none;
        touch-action: none;
      }
      /* touch-action is NOT inherited, so setting it on <body> did nothing for
         the canvas — iOS Safari treated every drag as a scroll or zoom gesture
         and swallowed it. This is why touch movement did not work on iPad. */
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* The name box in the Monster Maker is a real text field sitting on top
         of the canvas. iOS only shows its keyboard for a visible input that is
         focused during an actual tap, so it has to be a genuine element. */
      #mm-name {
        position: fixed;
        display: none;
        font: bold 18px system-ui, sans-serif;
        color: #dfffcb;
        background: #14301f;
        border: 2px solid #4ea86a;
        border-radius: 6px;
        padding: 4px 10px;
        outline: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
